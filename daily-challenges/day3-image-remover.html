<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 3 - Image Remover</title></head><body><h1>Image Remover</h1><p>Sample images for the challenge:</p><img alt="Blue sample" width="120" src="https://placehold.co/120x80/4477cc/ffffff?text=One"><img alt="Green sample" width="120" src="https://placehold.co/120x80/228855/ffffff?text=Two"><p><button id="remove">Remove all images</button> <button id="restore">Restore sample images</button></p><p><a href="../index.html">Back to project</a></p><script>const originals=[...document.querySelectorAll("img")].map(img=>({alt:img.alt,src:img.src}));document.querySelector("#remove").addEventListener("click",()=>document.querySelectorAll("img").forEach(img=>img.remove()));document.querySelector("#restore").addEventListener("click",()=>{if(!document.querySelector("img"))originals.forEach(data=>{const img=document.createElement("img");img.alt=data.alt;img.width=120;img.src=data.src;document.body.insertBefore(img,document.querySelector("#remove").parentElement);});});</script></body></html>
