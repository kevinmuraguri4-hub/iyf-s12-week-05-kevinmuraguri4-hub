<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 4 - Copy Content</title></head><body><h1>Copy Content Between Elements</h1><p id="source">This text will be copied into the destination box.</p><div id="destination" style="padding:16px;border:1px solid #777;min-height:30px">Destination is empty.</div><button id="copy">Copy text</button><p><a href="../index.html">Back to project</a></p><script>document.querySelector("#copy").addEventListener("click",()=>document.querySelector("#destination").textContent=document.querySelector("#source").textContent);</script></body></html>
