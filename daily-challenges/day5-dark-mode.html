<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 5 - Dark Mode</title><style>body{font-family:system-ui;padding:30px;transition:.2s}body.dark{background:#121826;color:#f4f6fb}button{padding:10px 16px}</style></head><body><h1>Dark Mode Toggle</h1><p>Click the button to switch between light and dark themes.</p><button id="toggle" aria-pressed="false">Turn on dark mode</button><p><a href="../index.html">Back to project</a></p><script>const button=document.querySelector("#toggle");button.addEventListener("click",()=>{const dark=document.body.classList.toggle("dark");button.textContent=dark?"Turn off dark mode":"Turn on dark mode";button.setAttribute("aria-pressed",String(dark));});</script></body></html>
