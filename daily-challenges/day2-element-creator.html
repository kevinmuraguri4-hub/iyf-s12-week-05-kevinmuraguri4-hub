<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 2 - Element Creator</title><style>li{margin:10px}button{margin-left:10px}</style></head><body><h1>Dynamic Element Creator</h1><button id="add">Add paragraph</button><ol id="items"></ol><p><a href="../index.html">Back to project</a></p><script>const list=document.querySelector("#items");let count=0;document.querySelector("#add").addEventListener("click",()=>{const li=document.createElement("li"),p=document.createElement("span"),del=document.createElement("button");p.textContent="Paragraph "+(++count);del.textContent="Delete";del.addEventListener("click",()=>li.remove());li.append(p,del);list.append(li);});</script></body></html>
