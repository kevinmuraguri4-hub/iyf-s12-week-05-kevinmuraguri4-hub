<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 1 - Color Changer</title></head><body><h1>Color Changer</h1><h2>DOM Challenge</h2><h3>Click to change all headings</h3><button id="change">Random heading colors</button><p><a href="../index.html">Back to project</a></p><script>document.querySelector("#change").addEventListener("click",()=>document.querySelectorAll("h1,h2,h3").forEach(heading=>{heading.style.color="#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0");}));</script></body></html>
